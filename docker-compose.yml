# Simple IPTV Recorder. Deploy as a Portainer stack, or with `docker compose up -d`.
# Set M3U_URL and RECORDINGS_PATH in Portainer's "Environment variables" (or a
# .env file next to this one). Everything else is on the web page's Settings.
services:
  recorder:
    image: ghcr.io/frivensolutions/simple-iptv-recorder:latest
    container_name: simple-iptv-recorder
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      # The manager output's playlist link; its guide (epg.xml) is found next to it.
      M3U_URL: ${M3U_URL:?Set M3U_URL to the manager output's playlist.m3u link}
      TZ: ${TZ:-America/Chicago}
      # Your Synology user and group (run `id` over SSH), so you own the files.
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
    volumes:
      - ${CONFIG_PATH:-/volume1/docker/simple-iptv-recorder}:/config
      - ${RECORDINGS_PATH:?Set RECORDINGS_PATH to the NAS folder for recordings}:/recordings
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
