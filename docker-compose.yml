# Simple IPTV Recorder. Deploy as a Portainer stack (Repository or Web editor)
# or with `docker compose up -d --build`. Set the variables in Portainer's
# "Environment variables" section, or in a .env file next to this one
# (see .env.example).
services:
  recorder:
    build: .
    image: simple-iptv-recorder:latest
    container_name: simple-iptv-recorder
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8089}:8089"
    environment:
      M3U_URL: ${M3U_URL:?Set M3U_URL to the manager output's playlist.m3u link}
      EPG_URL: ${EPG_URL:-}
      TZ: ${TZ:-America/Chicago}
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      MAX_STREAMS: ${MAX_STREAMS:-4}
      REFRESH_HOURS: ${REFRESH_HOURS:-6}
      # First-run defaults; change them later on the Settings page.
      PRE_PADDING_MIN: ${PRE_PADDING_MIN:-2}
      POST_PADDING_MIN: ${POST_PADDING_MIN:-5}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      NTFY_URL: ${NTFY_URL:-}
      PUSHBULLET_TOKEN: ${PUSHBULLET_TOKEN:-}
    volumes:
      - ${CONFIG_PATH:-/volume1/docker/simple-iptv-recorder}:/config
      - ${RECORDINGS_PATH:?Set RECORDINGS_PATH to the NAS folder for recordings}:/recordings
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
